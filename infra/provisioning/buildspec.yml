version: 0.2

env:
  variables:
    CDK_DISABLE_VERSION_CHECK: "1"

phases:
  install:
    runtime-versions:
      python: 3.12
      nodejs: 20
    commands:
      - npm install -g aws-cdk@2
      - pip install -r requirements.txt
      - pip install -e packages/meshflow-platform -e packages/meshflow-connectors -e packages/meshflow-lake -e packages/meshflow-dna -e packages/meshflow-portal -e "packages/meshflow[dev]"
  pre_build:
    commands:
      - echo "Provisioning company=$MESHFLOW_COMPANY environment=$MESHFLOW_ENVIRONMENT client=$MESHFLOW_PORTAL_CLIENT_ID scope=$MESHFLOW_CDK_SCOPE"
      - |
        if [ -n "$MESHFLOW_CONFIG_S3_URI" ]; then
          python - <<'PY'
        from meshflow.project_config import sync_config_for_codebuild
        sync_config_for_codebuild()
        PY
        fi
  build:
    commands:
      - |
        STACKS=$(python - <<'PY'
        import os
        from meshflow.project_config import deploy_stack_names, resolve_selection
        company, environment = resolve_selection(
            company=os.environ.get("MESHFLOW_COMPANY"),
            environment=os.environ.get("MESHFLOW_ENVIRONMENT"),
        )
        stacks = deploy_stack_names(
            company=company,
            environment=environment,
            client_id=os.environ.get("MESHFLOW_PORTAL_CLIENT_ID"),
            scope=os.environ.get("MESHFLOW_CDK_SCOPE", "all"),
        )
        print(" ".join(stacks))
        PY
        )
        for STACK in $STACKS; do
          echo "Deploying $STACK"
          cdk deploy "$STACK" --require-approval never \
            -c company="$MESHFLOW_COMPANY" \
            -c environment="$MESHFLOW_ENVIRONMENT" \
            -c scope="${MESHFLOW_CDK_SCOPE:-all}"
        done
