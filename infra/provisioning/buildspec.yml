version: 0.2

env:
  variables:
    CDK_DISABLE_VERSION_CHECK: "1"

phases:
  install:
    runtime-versions:
      python: 3.12
      nodejs: 20
    commands:
      - npm install -g aws-cdk@2
      - pip install -r requirements.txt
      - pip install -e packages/hiveflow-platform -e packages/hiveflow-connectors -e packages/hiveflow-lake -e packages/hiveflow-dna -e packages/hiveflow-portal -e "packages/hiveflow[dev]"
  pre_build:
    commands:
      - echo "Provisioning company=$HIVEFLOW_COMPANY environment=$HIVEFLOW_ENVIRONMENT client=$HIVEFLOW_PORTAL_CLIENT_ID scope=$HIVEFLOW_CDK_SCOPE"
      - |
        if [ -n "$HIVEFLOW_CONFIG_S3_URI" ]; then
          python - <<'PY'
        from hiveflow.project_config import sync_config_for_codebuild
        sync_config_for_codebuild()
        PY
        fi
  build:
    commands:
      - |
        STACKS=$(python - <<'PY'
        import os
        from hiveflow.project_config import deploy_stack_names, resolve_selection
        company, environment = resolve_selection(
            company=os.environ.get("HIVEFLOW_COMPANY"),
            environment=os.environ.get("HIVEFLOW_ENVIRONMENT"),
        )
        stacks = deploy_stack_names(
            company=company,
            environment=environment,
            client_id=os.environ.get("HIVEFLOW_PORTAL_CLIENT_ID"),
            scope=os.environ.get("HIVEFLOW_CDK_SCOPE", "all"),
        )
        print(" ".join(stacks))
        PY
        )
        for STACK in $STACKS; do
          echo "Deploying $STACK"
          cdk deploy "$STACK" --require-approval never \
            -c company="$HIVEFLOW_COMPANY" \
            -c environment="$HIVEFLOW_ENVIRONMENT" \
            -c scope="${HIVEFLOW_CDK_SCOPE:-all}"
        done
