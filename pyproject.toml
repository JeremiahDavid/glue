[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meshflow-workspace"
version = "0.1.0"
description = "Meshflow monorepo workspace (install packages/* for the product)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "aws-cdk-lib>=2.170.0",
    "constructs>=10.0.0",
    "pytest>=8.0.0",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "packages/meshflow-platform/tests",
    "packages/meshflow-connectors/tests",
    "packages/meshflow-lake/tests",
    "packages/meshflow-dna/tests",
    "packages/meshflow-portal/tests",
]
norecursedirs = ["cdk.out", ".git", ".venv", "node_modules"]
