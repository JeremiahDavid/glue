[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meshflow"
version = "0.1.0"
description = "Meshflow reconciliation layer POC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "intuit-oauth>=1.2.6",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "boto3>=1.35.0",
    "botocore[crt]>=1.35.0",
    "pyyaml>=6.0.0",
    "pyarrow>=18.0.0",
    "lxml>=5.3.0",
    "werkzeug>=3.1.0",
    "aws-wsgi>=0.2.7",
]

[project.optional-dependencies]
dev = [
    "aws-cdk-lib>=2.170.0",
    "constructs>=10.0.0",
]

[project.scripts]
meshflow-qbo-auth = "meshflow.cli:auth_main"
meshflow-qbo-ingest = "meshflow.cli:ingest_main"
meshflow-qbd-soap = "meshflow.cli:qbd_soap_main"
meshflow-qbd-generate-qwc = "meshflow.cli:qbd_generate_qwc_main"
meshflow-consolidate = "meshflow.cli:consolidate_main"
meshflow-athena-query = "meshflow.cli:athena_query_main"
meshflow-sync-athena-catalog = "meshflow.cli:sync_athena_catalog_main"

[tool.setuptools.packages.find]
where = ["src"]
