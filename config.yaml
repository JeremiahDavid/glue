default:
  company: POC
  environment: dev

secrets:
  secret_name_template: meshflow-{company}-{source}-{environment}
  data_bucket_name_template: meshflow-{company}-{account}-{region}
  athena_results_bucket_name_template: athena-results-{company}-{account}-{region}

companies:
  POC:
    environments:
      dev:
        aws:
          region: us-east-2
        qbo:
          tier: sandbox
          entity_bundle: full_accounting
          schedule:
            hour: 6
            minute: 0
        qbd:
          entity_bundle: full_accounting
        dbc:
          entity_bundle: full
          schedule:
            hour: 6
            minute: 0
        dna:
          enabled: true
          source: dbc
          pack_id: bc_intra_v1
          schedule:
            hour: 7
            minute: 0
        ui:
          enabled: true
          pack_id: bc_intra_v1
          branding:
            bucket: hive-flow-ai-branding
            symbol_key: "HiveFlowAI Symbol.png"
            logo_key: "HiveFlowAI Logo.png"
          portal:
            default_client_id: poc
            default_max_users: 10
            clients:
              poc:
                display_name: "POC Distribution Co."
                max_users: 10
                welcome_title: "Your operational dashboard"
                welcome_message: >
                  Certified Business Central metrics from your governed semantic layer.
                pack_id: bc_intra_v1
                accent_color: "#14b8a6"
          domain:
            zone_name: hive-flow-ai.com
            primary_hostname: hive-flow-ai.com
            alternate_hostnames:
              - www
            create_hosted_zone: true

      prod:
        aws:
          region: us-east-2
          account: REPLACE_WITH_PROD_ACCOUNT_ID
        qbo:
          tier: production
          entity_bundle: full_accounting
          schedule:
            hour: 6
            minute: 0

