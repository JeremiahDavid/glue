default:
  company: your_company
  environment: dev

secrets:
  # Defaults as of the 2026-08 meshflow->hiveflow rebrand. If you have an
  # existing deployed environment whose secret/bucket were created under the
  # old "meshflow-..." naming, override both templates back to that pattern
  # here — changing either name forces Secrets Manager / S3 to replace the
  # live resource rather than update it in place.
  secret_name_template: hiveflow-{company}-{source}-{environment}
  data_bucket_name_template: hiveflow-{company}-{account}-{region}
  athena_results_bucket_name_template: athena-results-{company}-{account}-{region}

companies:
  your_company:
    environments:
      dev:
        aws:
          region: us-east-2
        qbo:
          tier: sandbox
        ingest:
          connector: qbo
          entity_bundle: v1_accounting
          schedule:
            hour: 6
            minute: 0

        # Example Business Central block (MESH-BC-INTRA):
        # bc:
        #   entity_bundle: v1_intra
        #   schedule:
        #     hour: 6
        #     minute: 0

      prod:
        aws:
          region: us-east-2
          account: REPLACE_WITH_PROD_ACCOUNT_ID
        qbo:
          tier: production
        ingest:
          connector: qbo
          entity_bundle: v1_accounting
          schedule:
            hour: 6
            minute: 0

  other_company:
    environments:
      dev:
        aws:
          region: us-west-2
        qbo:
          tier: sandbox
        ingest:
          connector: qbo
          entity_bundle: full_accounting
          schedule:
            hour: 7
            minute: 0
