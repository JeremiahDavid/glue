[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hiveflow"
version = "0.1.0"
description = "HiveFlow meta-package — CLI and full local install"
requires-python = ">=3.11"
dependencies = [
    "intuit-oauth>=1.2.6",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "boto3>=1.35.0",
    "botocore[crt]>=1.35.0",
    "pyyaml>=6.0.0",
    "jsonschema>=4.23.0",
    "pyarrow>=18.0.0",
    "lxml>=5.3.0",
    "werkzeug>=3.1.0",
    "aws-wsgi>=0.2.7",
]

[project.optional-dependencies]
dev = [
    "aws-cdk-lib>=2.170.0",
    "constructs>=10.0.0",
    "pytest>=8.0.0",
]

[project.scripts]
hiveflow-qbo-auth = "hiveflow.cli:auth_main"
hiveflow-qbo-ingest = "hiveflow.cli:ingest_main"
hiveflow-bc-ingest = "hiveflow.cli:bc_ingest_main"
hiveflow-qbd-soap = "hiveflow.cli:qbd_soap_main"
hiveflow-qbd-generate-qwc = "hiveflow.cli:qbd_generate_qwc_main"
hiveflow-consolidate = "hiveflow.cli:consolidate_main"
hiveflow-athena-query = "hiveflow.cli:athena_query_main"
hiveflow-sync-athena-catalog = "hiveflow.cli:sync_athena_catalog_main"
hiveflow-dna = "hiveflow.cli:dna_main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
