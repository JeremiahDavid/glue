pack_id: dbc_dna_boilerplate
version: "1.1.0"
status: production
source_system: dbc
description: >
  Business Central DNA boilerplate — order-to-cash facts, executive KPIs with
  MTD/QTD/YTD YoY comparisons, backlog, and margin rankings.
limitations:
  - Single BC company scope (no multi-company consolidation)
  - Standard APV2 entities only — custom extension tables excluded
  - Revenue uses invoice line amounts; excludes credit memos in v1
  - Posting date drives invoice period attribution (not document date)
  - Gross profit requires unitCost on invoice lines; omitted when cost is missing
  - Order bookings use orderDate; backlog includes open/released order lines only
source_documents:
  - title: BC data model reference
    path: docs/dbc-data-model.md
    citation: Meshflow internal — order-to-cash join paths

calendar:
  id: cal_bc
  type: calendar_year
  date_column: postingDate
  fiscal_year_start_month: 1
  period_grain: month
  description: >
    Default calendar-year periods. Set type to fiscal_year and
    fiscal_year_start_month for non-January fiscal calendars.

entities:
  - id: ent_customers
    grain: customer
    silver_entity: customers
    primary_key: id
    description: BC customer master
  - id: ent_items
    grain: item
    silver_entity: items
    primary_key: id
    description: BC item master
  - id: ent_sales_invoices
    grain: document
    silver_entity: sales_invoices
    primary_key: id
    description: Posted sales invoice headers
  - id: ent_sales_invoice_lines
    grain: line
    silver_entity: sales_invoice_lines
    primary_key: id
    description: Posted sales invoice lines
  - id: ent_sales_orders
    grain: document
    silver_entity: sales_orders
    primary_key: id
    description: Sales order headers (open and released)
  - id: ent_sales_order_lines
    grain: line
    silver_entity: sales_order_lines
    primary_key: id
    description: Open and released sales order lines
  - id: ent_sales_shipment_lines
    grain: line
    silver_entity: sales_shipment_lines
    primary_key: id
    description: Posted sales shipment lines

joins:
  - id: join_invoice_line_header
    left_entity: ent_sales_invoice_lines
    right_entity: ent_sales_invoices
    left_key: documentId
    right_key: id
    cardinality: many_to_one
    description: Invoice line to invoice header (customerId and postingDate live on header)
  - id: join_invoice_line_item
    left_entity: ent_sales_invoice_lines
    right_entity: ent_items
    left_key: itemId
    right_key: id
    cardinality: many_to_one
    description: Invoice line to item master
  - id: join_order_line_header
    left_entity: ent_sales_order_lines
    right_entity: ent_sales_orders
    left_key: documentId
    right_key: id
    cardinality: many_to_one
    description: Order line to order header (orderDate and status live on header)
  - id: join_shipment_line_item
    left_entity: ent_sales_shipment_lines
    right_entity: ent_items
    left_key: itemId
    right_key: id
    cardinality: many_to_one
    description: Shipment line to item master

dimensions:
  - id: dim_customer_number
    entity_id: ent_customers
    column: number
    display_name: Customer number
  - id: dim_customer_name
    entity_id: ent_customers
    column: displayName
    display_name: Customer name
  - id: dim_item_number
    entity_id: ent_items
    column: number
    display_name: Item number

outputs:
  - id: out_dim_customers
    output_type: table
    build: entity_copy
    entity_id: ent_customers
    columns: [id, number, displayName, balanceDue, creditLimit]
  - id: out_dim_items
    output_type: table
    build: entity_copy
    entity_id: ent_items
    columns: [id, number, displayName, type, unitPrice]
  - id: out_fact_revenue_lines
    output_type: table
    build: join
    join_id: join_invoice_line_header
    columns:
      - id
      - documentId
      - sequence
      - customerId
      - itemId
      - quantity
      - unitPrice
      - unitCost
      - netAmount
      - postingDate
      - customerNumber
      - customerName
      - costAmount
      - grossProfit
  - id: out_fact_order_lines
    output_type: table
    build: join
    join_id: join_order_line_header
    columns:
      - id
      - documentId
      - sequence
      - customerId
      - itemId
      - quantity
      - unitPrice
      - lineAmount
      - outstandingQuantity
      - backlogAmount
      - orderDate
      - status
      - customerNumber
      - customerName
  - id: out_kpi_snapshot
    output_type: kpi_snapshot
    build: kpi_aggregate
    kpi_ids:
      - KPI-REV-01
      - KPI-INV-01
      - KPI-CUST-01
      - KPI-SHIP-01
      - KPI-ORD-01
  - id: out_executive_kpis
    output_type: kpi_snapshot
    build: kpi_aggregate
    kpi_ids:
      - KPI-REV-YoY-MTD
      - KPI-REV-YoY-QTD
      - KPI-REV-YoY-YTD
      - KPI-INV-YoY-MTD
      - KPI-INV-YoY-QTD
      - KPI-INV-YoY-YTD
      - KPI-ORD-YoY-MTD
      - KPI-ORD-YoY-QTD
      - KPI-ORD-YoY-YTD
      - KPI-ORDLN-YoY-MTD
      - KPI-ORDLN-YoY-QTD
      - KPI-ORDLN-YoY-YTD
      - KPI-GP-YoY-MTD
      - KPI-GP-YoY-QTD
      - KPI-GP-YoY-YTD
      - KPI-GM-YoY-MTD
      - KPI-GM-YoY-QTD
      - KPI-GM-YoY-YTD
  - id: out_executive_snapshot
    output_type: kpi_snapshot
    build: kpi_aggregate
    kpi_ids:
      - KPI-BKL-01
      - KPI-BKL-02
      - KPI-BKL-03
  - id: out_rev_by_customer_period
    output_type: table
    build: kpi_aggregate
    kpi_ids:
      - KPI-REV-01-YoY
  - id: out_top_customers_ytd
    output_type: table
    build: kpi_aggregate
    top_n: 10
    kpi_ids:
      - KPI-REV-YoY-YTD-CUST
  - id: out_top_items_ytd
    output_type: table
    build: kpi_aggregate
    top_n: 10
    kpi_ids:
      - KPI-REV-YoY-YTD-ITEM
  - id: out_top_customers_margin_ytd
    output_type: table
    build: kpi_aggregate
    top_n: 10
    kpi_ids:
      - KPI-GP-YoY-YTD-CUST
  - id: out_top_items_margin_ytd
    output_type: table
    build: kpi_aggregate
    top_n: 10
    kpi_ids:
      - KPI-GP-YoY-YTD-ITEM

kpis:
  - id: KPI-REV-01
    name: Net sales revenue
    definition: Sum of posted sales invoice line amounts
    formula_type: sum
    source_output: out_fact_revenue_lines
    value_column: netAmount
    unit: currency
    doc_citation: Standard BC posted invoice revenue at line grain
    format:
      type: currency
      decimal_places: 2
      scale: none
  - id: KPI-INV-01
    name: Invoice line count
    definition: Count of posted sales invoice lines
    formula_type: count
    source_output: out_fact_revenue_lines
    value_column: id
    unit: count
    format:
      type: number
      decimal_places: 0
      scale: none
  - id: KPI-CUST-01
    name: Active invoiced customers
    definition: Distinct customers with at least one invoice line
    formula_type: count_distinct
    source_output: out_fact_revenue_lines
    value_column: customerId
    unit: count
    format:
      type: number
      decimal_places: 0
      scale: none
  - id: KPI-SHIP-01
    name: Shipped quantity
    definition: Sum of quantities on posted sales shipment lines
    formula_type: sum
    source_output: ent_sales_shipment_lines
    value_column: quantity
    unit: quantity
    format:
      type: quantity
      decimal_places: 2
      scale: none
  - id: KPI-ORD-01
    name: Open order line quantity
    definition: Sum of quantities on open sales order lines
    formula_type: sum
    source_output: ent_sales_order_lines
    value_column: quantity
    unit: quantity
    format:
      type: quantity
      decimal_places: 2
      scale: none
  - id: KPI-ORD-02
    name: Order bookings
    definition: Sum of sales order line amounts by order date
    formula_type: sum
    source_output: out_fact_order_lines
    value_column: lineAmount
    unit: currency
    format:
      type: currency
      decimal_places: 2
      scale: none
  - id: KPI-ORD-03
    name: Order line count
    definition: Count of sales order lines by order date
    formula_type: count
    source_output: out_fact_order_lines
    value_column: id
    unit: count
    format:
      type: number
      decimal_places: 0
      scale: none
  - id: KPI-GP-01
    name: Gross profit
    definition: Sum of invoice line gross profit (net amount minus line cost)
    formula_type: sum
    source_output: out_fact_revenue_lines
    value_column: grossProfit
    unit: currency
    format:
      type: currency
      decimal_places: 2
      scale: none
  - id: KPI-GM-01
    name: Gross margin
    definition: Gross profit divided by net sales revenue
    formula_type: ratio
    numerator_kpi: KPI-GP-01
    denominator_kpi: KPI-REV-01
    unit: percent
    format:
      type: percent
      decimal_places: 1
      scale: none
  - id: KPI-BKL-01
    name: Backlog amount
    definition: Sum of outstanding order line value on open/released orders
    formula_type: sum
    source_output: out_fact_order_lines
    value_column: backlogAmount
    filter_column: status
    filter_value: Open
    unit: currency
    format:
      type: currency
      decimal_places: 2
      scale: none
  - id: KPI-BKL-02
    name: Backlog line count
    definition: Count of open order lines with outstanding quantity
    formula_type: count
    source_output: out_fact_order_lines
    value_column: id
    filter_column: status
    filter_value: Open
    unit: count
    format:
      type: number
      decimal_places: 0
      scale: none
  - id: KPI-BKL-03
    name: Open order count
    definition: Distinct open sales orders
    formula_type: count_distinct
    source_output: out_fact_order_lines
    value_column: documentId
    filter_column: status
    filter_value: Open
    unit: count
    format:
      type: number
      decimal_places: 0
      scale: none
  - id: KPI-REV-01-YoY
    name: Net sales revenue CY vs PY by customer
    definition: >
      Posted invoice line revenue by customer and calendar/fiscal period,
      compared to the same period in the prior year.
    formula_type: period_compare
    base_kpi: KPI-REV-01
    compare: prior_year
    result: [current, prior, delta, pct_change]
    group_by: [customerId]
    time:
      calendar_id: cal_bc
      window: period
    unit: currency
    format:
      type: currency
      decimal_places: 2
      scale: thousands
  - id: KPI-REV-YoY-MTD
    name: Net sales revenue MTD vs PY
    formula_type: period_compare
    base_kpi: KPI-REV-01
    compare: prior_year
    result: [current, prior, delta, pct_change]
    time:
      calendar_id: cal_bc
      window: mtd
    unit: currency
    format:
      type: currency
      decimal_places: 2
      scale: none
  - id: KPI-REV-YoY-QTD
    name: Net sales revenue QTD vs PY
    formula_type: period_compare
