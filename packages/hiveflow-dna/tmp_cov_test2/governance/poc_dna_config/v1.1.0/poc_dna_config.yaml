pack_id: poc_dna_config
version: 1.1.0
status: production
source_system: dbc
description: 'Business Central DNA boilerplate — order-to-cash facts, executive KPIs
  with MTD/QTD/YTD YoY comparisons, backlog, and margin rankings.

  '
limitations:
- Single BC company scope (no multi-company consolidation)
- Standard APV2 entities only — custom extension tables excluded
- Revenue uses invoice line amounts; excludes credit memos in v1
- Posting date drives invoice period attribution (not document date)
- Gross profit requires unitCost on invoice lines; omitted when cost is missing
- Order bookings use orderDate; backlog includes open/released order lines only
source_documents:
- title: BC data model reference
  path: docs/dbc-data-model.md
  citation: Meshflow internal — order-to-cash join paths
entities:
- id: ent_customers
  grain: customer
  silver_entity: customers
  primary_key: id
  description: BC customer master
- id: ent_items
  grain: item
  silver_entity: items
  primary_key: id
  description: BC item master
- id: ent_sales_invoices
  grain: document
  silver_entity: sales_invoices
  primary_key: id
  description: Posted sales invoice headers
- id: ent_sales_invoice_lines
  grain: line
  silver_entity: sales_invoice_lines
  primary_key: id
  description: Posted sales invoice lines
- id: ent_sales_orders
  grain: document
  silver_entity: sales_orders
  primary_key: id
  description: Sales order headers (open and released)
- id: ent_sales_order_lines
  grain: line
  silver_entity: sales_order_lines
  primary_key: id
  description: Open and released sales order lines
- id: ent_sales_shipment_lines
  grain: line
  silver_entity: sales_shipment_lines
  primary_key: id
  description: Posted sales shipment lines
joins:
- id: join_invoice_line_header
  left_entity: ent_sales_invoice_lines
  right_entity: ent_sales_invoices
  left_key: documentId
  right_key: id
  cardinality: many_to_one
  description: Invoice line to invoice header (customerId and postingDate live on
    header)
- id: join_invoice_line_item
  left_entity: ent_sales_invoice_lines
  right_entity: ent_items
  left_key: itemId
  right_key: id
  cardinality: many_to_one
  description: Invoice line to item master
- id: join_order_line_header
  left_entity: ent_sales_order_lines
  right_entity: ent_sales_orders
  left_key: documentId
  right_key: id
  cardinality: many_to_one
  description: Order line to order header (orderDate and status live on header)
- id: join_shipment_line_item
  left_entity: ent_sales_shipment_lines
  right_entity: ent_items
  left_key: itemId
  right_key: id
  cardinality: many_to_one
  description: Shipment line to item master
dimensions:
- id: dim_customer_number
  entity_id: ent_customers
  column: number
  display_name: Customer number
- id: dim_customer_name
  entity_id: ent_customers
  column: displayName
  display_name: Customer name
- id: dim_item_number
  entity_id: ent_items
  column: number
  display_name: Item number
outputs:
