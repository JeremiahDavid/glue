[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hiveflow-lake"
version = "0.1.0"
description = "HiveFlow silver consolidation and Glue/Athena catalog"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35.0",
    "pyyaml>=6.0.0",
    "pyarrow>=18.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
