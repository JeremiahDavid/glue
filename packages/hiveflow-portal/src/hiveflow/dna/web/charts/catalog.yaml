# HiveFlowAI reporting chart catalog
# Canonical schema for Reporting Engine codegen and portal implementations.
# Python builders live in hiveflow.dna.web.charts.catalog.

version: "1.0.0"
engine: echarts
theme: hiveflowai

value_formats:
  number:
    description: Plain numeric values with thousands separators.
  currency:
    description: Fixed two-decimal currency (USD-style).
  compact_currency:
    description: Abbreviated currency axis labels ($12k, $1.2M).
  percent:
    description: Percent values; values <= 1 render as percent, otherwise treated as whole percent.

chart_types:
  bar:
    label: Bar
    description: Vertical bars for category comparisons and monthly totals.
    required_fields: [categories, series]
    optional_fields: [title, subtitle, value_format, stacked, height, aria_label]
    min_series: 1
    max_series: 8
    example:
      chart_type: bar
      title: Monthly revenue
      value_format: currency
      categories: ["Jan '25", "Feb '25", "Mar '25"]
      series:
        - name: Revenue
          values: [120000, 98000, 143000]

  line:
    label: Line
    description: Trend lines over ordered categories or time buckets.
    required_fields: [categories, series]
    optional_fields: [title, value_format, smooth, height]
    min_series: 1
    max_series: 8

  area:
    label: Area
    description: Filled line chart for cumulative or volume trends.
    required_fields: [categories, series]
    optional_fields: [title, value_format, smooth, stacked, height]
    min_series: 1
    max_series: 6

  horizontal_bar:
    label: Horizontal bar
    description: Ranked categories such as top customers or SKUs.
    required_fields: [categories, series]
    optional_fields: [title, value_format, height]
    min_series: 1
    max_series: 4

  stacked_bar:
    label: Stacked bar
    description: Part-to-whole comparisons across categories.
    required_fields: [categories, series]
    optional_fields: [title, value_format, height]
    min_series: 2
    max_series: 8

  pie:
    label: Pie
    description: Share of total for a single metric across categories.
    required_fields: [categories, series]
    optional_fields: [title, value_format, height]
    min_series: 1
    max_series: 1

  donut:
    label: Donut
    description: Pie chart with center cutout for KPI callouts.
    required_fields: [categories, series]
    optional_fields: [title, value_format, donut_inner_radius, height]
    min_series: 1
    max_series: 1

  combo:
    label: Combo
    description: Bars for volume with a line overlay for rate or target.
    required_fields: [categories, series]
    optional_fields: [title, value_format, smooth, height]
    min_series: 2
    max_series: 2
