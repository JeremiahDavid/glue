{% for item in items %}
{% set field = item.field %}
{% if field.company_picker %}
      <div class="form-field" data-dbc-company-picker>
        <label for="{{ item.field_id }}">{{ field.label }}</label>
        <div class="admin-dbc-company-picker-row">
          <select id="{{ item.field_id }}" name="{{ field.key }}"
                  data-credential-main="{{ field.key }}" title="{{ field.hint }}"
                  class="admin-onboarding-select"{% if not item.saved_value %} disabled{% endif %}>
            <option value="">Load companies to select…</option>
            {% if item.saved_value %}<option value="{{ item.saved_value }}" selected>{{ item.saved_value }}</option>{% endif %}
          </select>
          <button type="button" class="btn secondary" data-dbc-load-companies
                  title="{{ item.load_title }}"{% if not item.lookup_ready %} disabled{% endif %}>Load companies</button>
        </div>
        <p class="pack-card-lead admin-dbc-company-status" data-dbc-company-status hidden></p>
      </div>
{% else %}
      <div class="form-field">
        <label for="{{ item.field_id }}">{{ field.label }}</label>
        <input id="{{ item.field_id }}" name="{{ field.key }}" type="{{ field.input_type }}"
               data-credential-main="{{ field.key }}" title="{{ field.hint }}" autocomplete="off"
               {% if item.saved_value %}value="{{ item.saved_value }}"{% endif %} />
      </div>
{% endif %}
{% endfor %}
