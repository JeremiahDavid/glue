{% if not stacks %}<p class="pack-card-lead">No stacks configured.</p>{% else %}<div class="table-wrap" data-stack-table><table><thead><tr><th>Stack</th><th>Status</th><th>Reason</th></tr></thead><tbody>{% for item in stacks %}<tr data-stack-row data-stack-name="{{ item.stack_name }}" data-stack-status="{{ item.status }}"><td><code>{{ item.stack_name }}</code></td><td>{{ item.status_cell }}</td><td data-stack-reason>{{ item.status_reason }}</td></tr>{% endfor %}</tbody></table></div>{% endif %}
