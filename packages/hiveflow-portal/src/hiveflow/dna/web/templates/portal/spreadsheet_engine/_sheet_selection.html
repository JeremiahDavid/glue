
    <section class="card spreadsheet-sheet-select" id="spreadsheet-sheet-select">
      <h2>Select sheets to analyze</h2>
      <p class="muted">Workbook: <strong>{{ filename }}</strong>. Choose which sheets should be profiled and proposed. Unchecked sheets are skipped.</p>
      <form method="post" class="spreadsheet-sheet-select-form">
        <input type="hidden" name="action" value="select_sheets" />
        <input type="hidden" name="job_id" value="{{ job_id }}" />
        <div class="spreadsheet-sheet-select-list" role="group" aria-label="Workbook sheets">
          {% if rows %}{% for row in rows %}<label class="spreadsheet-sheet-option" for="spreadsheet-sheet-{{ row.name }}"><input type="checkbox" id="spreadsheet-sheet-{{ row.name }}" name="sheet" value="{{ row.name }}" checked /><span class="spreadsheet-sheet-option-name">{{ row.name }}</span>{% if row.table_count == 1 %}<span class="muted">1 table detected</span>{% elif row.table_count is not none %}<span class="muted">{{ row.table_count }} tables detected</span>{% endif %}</label>{% endfor %}{% else %}<p class="muted">No sheets were found in this workbook.</p>{% endif %}
        </div>
        <div class="spreadsheet-sheet-select-actions">
          <button type="submit" class="btn btn-primary">Generate proposals</button>
        </div>
      </form>
    </section>
