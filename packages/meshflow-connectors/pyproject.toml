[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meshflow-connectors"
version = "0.1.0"
description = "Meshflow source connectors (QBO, QBD, Business Central) and ingest orchestration"
requires-python = ">=3.11"
dependencies = [
    "intuit-oauth>=1.2.6",
    "httpx>=0.28.0",
    "lxml>=5.3.0",
    "boto3>=1.35.0",
    "pyyaml>=6.0.0",
    "pyarrow>=18.0.0",
    "python-dotenv>=1.0.0",
    "jsonschema>=4.23.0",
    "openpyxl>=3.1.5",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
