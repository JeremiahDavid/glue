[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meshflow-dna"
version = "0.1.0"
description = "Meshflow DNA semantic engine (compile, validate, publish, governance)"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35.0",
    "pyyaml>=6.0.0",
    "pyarrow>=18.0.0",
    "jsonschema>=4.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"meshflow.dna" = ["packs/*", "schema/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
