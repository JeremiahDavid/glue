[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meshflow-portal"
version = "0.1.0"
description = "Meshflow portal UI, reporting surfaces, and Cognito auth"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35.0",
    "pyyaml>=6.0.0",
    "pyarrow>=18.0.0",
    "werkzeug>=3.1.0",
    "aws-wsgi>=0.2.7",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"meshflow.dna.web" = ["static/*", "charts/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
