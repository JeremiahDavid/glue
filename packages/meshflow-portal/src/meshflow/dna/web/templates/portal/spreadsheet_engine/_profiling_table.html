<table class="semantic-builder-table"><thead><tr><th>Column</th><th>Type</th><th>Null %</th><th>Cardinality</th><th>Key?</th><th>Patterns</th></tr></thead><tbody>{% for row in rows %}<tr><td><code>{{ row.name }}</code></td><td>{{ row.type }}</td><td>{{ row.null_rate }}</td><td>{{ row.cardinality }}</td><td>{{ 'yes' if row.is_key else '' }}</td><td>{{ row.patterns }}</td></tr>{% endfor %}</tbody></table>
