{% if note %}<p class="section-title" style="margin-top:0">{{ note }}</p>{% endif %}
    <div class="table-wrap">
      <table>
        <thead><tr>{% for col in columns %}<th class="{{ 'num' if col.numeric else '' }}">{{ col.label }}</th>{% endfor %}</tr></thead>
        <tbody>{% for row in rows %}<tr>{% for cell in row %}<td class="{{ 'num' if cell.numeric else '' }}">{{ cell.value }}</td>{% endfor %}</tr>{% endfor %}</tbody>
      </table>
    </div>
