<ol class="admin-onboarding-steps">{% for step in steps %}<li class="admin-onboarding-step {{ step.state }}">{% if step.href %}<a class="admin-onboarding-step-btn" href="{{ step.href }}"><span class="admin-onboarding-step-marker">{{ step.marker }}</span><span class="admin-onboarding-step-label">{{ step.label }}</span></a>{% else %}<span class="admin-onboarding-step-marker">{{ step.marker }}</span><span class="admin-onboarding-step-label">{{ step.label }}</span>{% endif %}</li>{% if not loop.last %}<li class="admin-onboarding-step-bridge" aria-hidden="true"><span class="admin-onboarding-step-arrow"></span></li>{% endif %}{% endfor %}</ol>
