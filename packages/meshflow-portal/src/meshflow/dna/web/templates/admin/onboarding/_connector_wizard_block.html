
      <div class="admin-onboarding-connector-card">

          <input id="{{ prefix }}_enabled" type="checkbox" name="{{ prefix }}_enabled" value="on"{% if enabled %} checked{% endif %}/>

          {% for field in fields %}{{ field }}{% endfor %}
        </div>
      </div>
